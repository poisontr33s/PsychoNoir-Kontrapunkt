---
name: "Digital Necromancy Observatory v2.0 - Stalwart Resilient Edition"

# Event-driven failure capture system that learns from chaos
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      force_observatory:
        description: 'Force run observatory system'
        required: false
        default: 'false'
        type: boolean

env:
  OBSERVATORY_VERSION: "2.0.0"
  PSYCHO_NOIR_MODE: "STALWART_RESILIENCE"
  FAILURE_TAXONOMY_LEVEL: "ADAPTIVE"

jobs:
  # Simplified pre-flight scanning with robust error handling
  stalwart_preflight:
    name: "Stalwart Pre-Flight Observatory Scan"
    runs-on: ubuntu-latest
    outputs:
      scan_id: ${{ steps.gen-id.outputs.scan_id }}
      system_fingerprint: ${{ steps.scan.outputs.fingerprint }}
      risk_level: ${{ steps.risk.outputs.level }}
      proceed_with_matrix: ${{ steps.decision.outputs.proceed }}
    
    steps:
    - name: Generate Observatory Scan ID
      id: gen-id
      run: |
        SCAN_ID="STALWART_$(date +%Y%m%d_%H%M%S)_${{ github.run_number }}"
        echo "scan_id=$SCAN_ID" >> $GITHUB_OUTPUT
        echo "🦾 Stalwart Observatory ID: $SCAN_ID"
    
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Robust System Scan
      id: scan
      run: |
        mkdir -p observatory/stalwart-scan
        
        # Create scan report with error tolerance
        {
          echo "# Stalwart Observatory Pre-Flight Report"
          echo "Scan ID: ${{ steps.gen-id.outputs.scan_id }}"
          echo "Timestamp: $(date -u)"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo ""
          echo "## System Resources"
          echo "CPU Cores: $(nproc || echo 'unknown')"
          echo "Memory: $(free -h 2>/dev/null | grep Mem: | awk '{print $2}' || echo 'unknown')"
          echo "Disk Space: $(df -h / 2>/dev/null | tail -1 | awk '{print $4}' || echo 'unknown')"
          echo "Load: $(uptime 2>/dev/null | cut -d',' -f3- || echo 'unknown')"
        } > observatory/stalwart-scan/system-state.md
        
        # Generate system fingerprint
        FINGERPRINT=$(echo "${{ runner.os }}-${{ github.sha }}-$(date +%H)" | sha256sum | cut -d' ' -f1 | head -c 16)
        echo "fingerprint=$FINGERPRINT" >> $GITHUB_OUTPUT
        echo "System Fingerprint: $FINGERPRINT" >> observatory/stalwart-scan/system-state.md
    
    - name: Intelligent Risk Assessment
      id: risk
      run: |
        # Smart risk assessment with fallback logic
        RISK_SCORE=0
        
        # Package.json validation
        if [ -f "package.json" ]; then
          if ! npm list --depth=0 >/dev/null 2>&1; then
            RISK_SCORE=$((RISK_SCORE + 20))
            echo "Package dependency issues detected (+20)"
          fi
        fi
        
        # Requirements validation
        if [ -f "backend/requirements.txt" ]; then
          if grep -q "^\\.$" backend/requirements.txt 2>/dev/null; then
            RISK_SCORE=$((RISK_SCORE + 30))
            echo "Invalid requirements.txt detected (+30)"
          fi
        fi
        
        # Commit frequency analysis
        RECENT_COMMITS=$(git rev-list --count HEAD~5..HEAD 2>/dev/null || echo "0")
        if [ "$RECENT_COMMITS" -gt 3 ]; then
          RISK_SCORE=$((RISK_SCORE + 10))
          echo "High commit frequency: $RECENT_COMMITS commits (+10)"
        fi
        
        # Determine risk level with intelligent defaults
        if [ "$RISK_SCORE" -lt 15 ]; then
          LEVEL="LOW"
        elif [ "$RISK_SCORE" -lt 35 ]; then
          LEVEL="MEDIUM"
        else
          LEVEL="HIGH"
        fi
        
        echo "level=$LEVEL" >> $GITHUB_OUTPUT
        echo "🎯 Risk Assessment: $LEVEL (Score: $RISK_SCORE)"
        
        # Create detailed risk report
        {
          echo "# Risk Assessment Report"
          echo "Total Risk Score: $RISK_SCORE"
          echo "Risk Level: $LEVEL"
          echo "Recent Commits: $RECENT_COMMITS"
          echo "Assessment Time: $(date -u)"
        } > observatory/stalwart-scan/risk-assessment.md
    
    - name: Strategic Decision Matrix
      id: decision
      run: |
        # Intelligent decision on matrix scope based on risk
        RISK_LEVEL="${{ steps.risk.outputs.level }}"
        
        case "$RISK_LEVEL" in
          "LOW")
            PROCEED="limited"
            echo "🟢 Low risk detected - proceeding with limited matrix"
            ;;
          "MEDIUM")
            PROCEED="moderate"
            echo "🟡 Medium risk detected - proceeding with moderate matrix"
            ;;
          "HIGH")
            PROCEED="essential"
            echo "🔴 High risk detected - proceeding with essential runners only"
            ;;
          *)
            PROCEED="essential"
            echo "⚪ Unknown risk - defaulting to essential runners"
            ;;
        esac
        
        echo "proceed=$PROCEED" >> $GITHUB_OUTPUT
    
    - name: Upload Pre-Flight Data
      uses: actions/upload-artifact@v4
      with:
        name: stalwart-preflight-${{ steps.gen-id.outputs.scan_id }}
        path: observatory/stalwart-scan/
        retention-days: 30

  # Adaptive matrix based on risk assessment
  adaptive_matrix_scan:
    name: "Adaptive Matrix: ${{ matrix.category }}-${{ matrix.variant }}"
    needs: stalwart_preflight
    if: needs.stalwart_preflight.outputs.proceed_with_matrix != 'skip'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 4  # Reduced to prevent resource exhaustion
      matrix:
        include:
          # Essential runners (always run)
          - category: "essential-frontend"
            variant: "chrome-stable"
            os: "ubuntu-latest"
            scope: "essential"
          - category: "essential-backend"
            variant: "python-stable"
            os: "ubuntu-latest"
            scope: "essential"
          
          # Limited risk runners
          - category: "extended-frontend"
            variant: "firefox-test"
            os: "ubuntu-latest"
            scope: "limited"
          - category: "extended-backend"
            variant: "python-multi"
            os: "windows-latest"
            scope: "limited"
          
          # Moderate risk runners
          - category: "integration-test"
            variant: "cross-platform"
            os: "macos-latest"
            scope: "moderate"
          - category: "security-scan"
            variant: "vulnerability-check"
            os: "ubuntu-latest"
            scope: "moderate"
        exclude:
          # Conditional exclusions based on risk level
          - scope: "limited"
            category: ${{ needs.stalwart_preflight.outputs.proceed_with_matrix == 'essential' && 'extended-frontend' || 'never' }}
          - scope: "limited"  
            category: ${{ needs.stalwart_preflight.outputs.proceed_with_matrix == 'essential' && 'extended-backend' || 'never' }}
          - scope: "moderate"
            category: ${{ contains(fromJSON('["essential"]'), needs.stalwart_preflight.outputs.proceed_with_matrix) && 'integration-test' || 'never' }}
          - scope: "moderate"
            category: ${{ contains(fromJSON('["essential"]'), needs.stalwart_preflight.outputs.proceed_with_matrix) && 'security-scan' || 'never' }}

    steps:
    - name: Stalwart Runner Initialization
      run: |
        echo "🦾 Stalwart Observatory Runner Starting"
        echo "Category: ${{ matrix.category }}"
        echo "Variant: ${{ matrix.variant }}"
        echo "Scope: ${{ matrix.scope }}"
        echo "OS: ${{ matrix.os }}"
        echo "Scan ID: ${{ needs.stalwart_preflight.outputs.scan_id }}"
        echo "Risk Level: ${{ needs.stalwart_preflight.outputs.risk_level }}"
        
        # Create robust logging directory
        mkdir -p observatory/runners/${{ matrix.category }}-${{ matrix.variant }}
        
        # Initialize runner log with comprehensive metadata
        {
          echo "# Stalwart Runner Observatory Log"
          echo "Scan ID: ${{ needs.stalwart_preflight.outputs.scan_id }}"
          echo "Category: ${{ matrix.category }}"
          echo "Variant: ${{ matrix.variant }}"
          echo "Scope: ${{ matrix.scope }}"
          echo "OS: ${{ runner.os }}"
          echo "Architecture: ${{ runner.arch }}"
          echo "Start Time: $(date -u)"
          echo "Risk Level: ${{ needs.stalwart_preflight.outputs.risk_level }}"
          echo "System Fingerprint: ${{ needs.stalwart_preflight.outputs.system_fingerprint }}"
          echo ""
          echo "## Initial Environment"
          echo "PATH: $PATH"
          echo "Shell: $SHELL"
          echo "User: $(whoami 2>/dev/null || echo 'unknown')"
        } > observatory/runners/${{ matrix.category }}-${{ matrix.variant }}/startup.md
        
        # Set persistent environment variables
        echo "STALWART_RUNNER_ID=${{ matrix.category }}-${{ matrix.variant }}" >> $GITHUB_ENV
        echo "STALWART_START_TIME=$(date +%s)" >> $GITHUB_ENV

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Robust Category Execution
      id: execution
      run: |
        echo "🎭 Executing ${{ matrix.category }} variant ${{ matrix.variant }}"
        
        # Initialize outcome tracking with defaults
        OUTCOME="UNKNOWN"
        ERROR_TYPE="NONE"
        ERROR_DETAILS=""
        EXECUTION_LOG=""
        
        # Execute based on category with comprehensive error handling
        case "${{ matrix.category }}" in
          "essential-frontend"|"extended-frontend")
            echo "🎨 Frontend execution starting..."
            EXECUTION_LOG="Frontend setup initiated"
            
            if command -v npm >/dev/null 2>&1; then
              EXECUTION_LOG="$EXECUTION_LOG; npm available"
              if [ -f "package.json" ]; then
                EXECUTION_LOG="$EXECUTION_LOG; package.json found"
                if npm ci --no-audit --no-fund 2>&1; then
                  EXECUTION_LOG="$EXECUTION_LOG; dependencies installed"
                  if [ -d "frontend" ]; then
                    # Simple build process
                    mkdir -p dist/frontend
                    cp -r frontend/* dist/frontend/ 2>/dev/null || true
                    echo "Build completed for ${{ matrix.variant }}" > dist/frontend/build-info.txt
                    OUTCOME="SUCCESS"
                    EXECUTION_LOG="$EXECUTION_LOG; build successful"
                  else
                    OUTCOME="SUCCESS"
                    EXECUTION_LOG="$EXECUTION_LOG; no frontend directory, marking as success"
                  fi
                else
                  OUTCOME="FAILURE"
                  ERROR_TYPE="DEPENDENCY_FAILURE"
                  ERROR_DETAILS="npm ci failed"
                  EXECUTION_LOG="$EXECUTION_LOG; npm ci failed"
                fi
              else
                OUTCOME="SUCCESS"
                EXECUTION_LOG="$EXECUTION_LOG; no package.json, minimal setup"
              fi
            else
              OUTCOME="FAILURE"
              ERROR_TYPE="ENVIRONMENT_SETUP"
              ERROR_DETAILS="npm not available"
              EXECUTION_LOG="$EXECUTION_LOG; npm not found"
            fi
            ;;
          
          "essential-backend"|"extended-backend")
            echo "🐍 Backend execution starting..."
            EXECUTION_LOG="Backend setup initiated"
            
            if command -v python3 >/dev/null 2>&1; then
              EXECUTION_LOG="$EXECUTION_LOG; python3 available"
              if command -v pip >/dev/null 2>&1; then
                EXECUTION_LOG="$EXECUTION_LOG; pip available"
                pip install --upgrade pip --quiet 2>/dev/null || true
                if [ -f "backend/requirements.txt" ]; then
                  EXECUTION_LOG="$EXECUTION_LOG; requirements.txt found"
                  if pip install -r backend/requirements.txt --quiet 2>&1; then
                    OUTCOME="SUCCESS"
                    EXECUTION_LOG="$EXECUTION_LOG; requirements installed"
                  else
                    OUTCOME="PARTIAL_SUCCESS"
                    ERROR_TYPE="PARTIAL_DEPENDENCY_FAILURE"
                    ERROR_DETAILS="Some requirements failed"
                    EXECUTION_LOG="$EXECUTION_LOG; partial requirements failure"
                  fi
                else
                  OUTCOME="SUCCESS"
                  EXECUTION_LOG="$EXECUTION_LOG; no requirements.txt found"
                fi
              else
                OUTCOME="FAILURE"
                ERROR_TYPE="ENVIRONMENT_SETUP"
                ERROR_DETAILS="pip not available"
                EXECUTION_LOG="$EXECUTION_LOG; pip not found"
              fi
            else
              OUTCOME="FAILURE"
              ERROR_TYPE="ENVIRONMENT_SETUP"
              ERROR_DETAILS="python3 not available"
              EXECUTION_LOG="$EXECUTION_LOG; python3 not found"
            fi
            ;;
          
          "integration-test")
            echo "🔗 Integration testing..."
            EXECUTION_LOG="Integration test initiated"
            
            if [ -d "frontend" ] && [ -d "backend" ]; then
              OUTCOME="SUCCESS"
              EXECUTION_LOG="$EXECUTION_LOG; both frontend and backend present"
            else
              OUTCOME="FAILURE"
              ERROR_TYPE="MISSING_COMPONENTS"
              ERROR_DETAILS="Frontend or backend directory missing"
              EXECUTION_LOG="$EXECUTION_LOG; missing required directories"
            fi
            ;;
          
          "security-scan")
            echo "🛡️ Security scanning..."
            EXECUTION_LOG="Security scan initiated"
            
            # Simple security check
            if find . -name "*.py" -o -name "*.js" -o -name "*.ts" | head -5 | grep -q .; then
              OUTCOME="SUCCESS"
              EXECUTION_LOG="$EXECUTION_LOG; scannable files found"
            else
              OUTCOME="FAILURE"
              ERROR_TYPE="NO_SCAN_TARGETS"
              ERROR_DETAILS="No scannable files found"
              EXECUTION_LOG="$EXECUTION_LOG; no files to scan"
            fi
            ;;
          
          *)
            OUTCOME="FAILURE"
            ERROR_TYPE="UNKNOWN_CATEGORY"
            ERROR_DETAILS="Category ${{ matrix.category }} not recognized"
            EXECUTION_LOG="Unknown category execution attempted"
            ;;
        esac
        
        # Output results for next steps
        echo "outcome=$OUTCOME" >> $GITHUB_OUTPUT
        echo "error_type=$ERROR_TYPE" >> $GITHUB_OUTPUT
        echo "error_details=$ERROR_DETAILS" >> $GITHUB_OUTPUT
        echo "execution_log=$EXECUTION_LOG" >> $GITHUB_OUTPUT
        
        echo "🎯 Execution Result: $OUTCOME"
        if [ "$OUTCOME" != "SUCCESS" ]; then
          echo "⚠️ Error Type: $ERROR_TYPE"
          echo "📝 Details: $ERROR_DETAILS"
        fi
        echo "📋 Execution Log: $EXECUTION_LOG"

    - name: Comprehensive Outcome Logging
      if: always()
      run: |
        END_TIME=$(date +%s)
        DURATION=$((END_TIME - STALWART_START_TIME))
        
        # Create detailed outcome report
        {
          echo "# Stalwart Observatory Outcome Report"
          echo "Scan ID: ${{ needs.stalwart_preflight.outputs.scan_id }}"
          echo "Runner ID: $STALWART_RUNNER_ID"
          echo "Category: ${{ matrix.category }}"
          echo "Variant: ${{ matrix.variant }}"
          echo "Scope: ${{ matrix.scope }}"
          echo "End Time: $(date -u)"
          echo "Duration: ${DURATION}s"
          echo "Outcome: ${{ steps.execution.outputs.outcome }}"
          echo "Error Type: ${{ steps.execution.outputs.error_type }}"
          echo "Error Details: ${{ steps.execution.outputs.error_details }}"
          echo "Execution Log: ${{ steps.execution.outputs.execution_log }}"
          echo ""
          echo "## Final System State"
          echo "Memory: $(free -h 2>/dev/null | grep Mem: || echo 'unavailable')"
          echo "Disk: $(df -h / 2>/dev/null | tail -1 || echo 'unavailable')"
          echo "Process Count: $(ps aux 2>/dev/null | wc -l || echo 'unavailable')"
        } > observatory/runners/${{ matrix.category }}-${{ matrix.variant }}/outcome.md
        
        # Create machine-readable JSON outcome
        cat > observatory/runners/${{ matrix.category }}-${{ matrix.variant }}/outcome.json << EOF
        {
          "scan_id": "${{ needs.stalwart_preflight.outputs.scan_id }}",
          "runner_id": "$STALWART_RUNNER_ID",
          "category": "${{ matrix.category }}",
          "variant": "${{ matrix.variant }}",
          "scope": "${{ matrix.scope }}",
          "os": "${{ runner.os }}",
          "outcome": "${{ steps.execution.outputs.outcome }}",
          "error_type": "${{ steps.execution.outputs.error_type }}",
          "error_details": "${{ steps.execution.outputs.error_details }}",
          "execution_log": "${{ steps.execution.outputs.execution_log }}",
          "duration_seconds": $DURATION,
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "system_fingerprint": "${{ needs.stalwart_preflight.outputs.system_fingerprint }}",
          "risk_level": "${{ needs.stalwart_preflight.outputs.risk_level }}"
        }
        EOF

    - name: Upload Stalwart Runner Data
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: stalwart-runner-${{ matrix.category }}-${{ matrix.variant }}-${{ github.run_number }}
        path: observatory/runners/${{ matrix.category }}-${{ matrix.variant }}/
        retention-days: 60

  # Enhanced failure analysis with robust error handling
  stalwart_analysis:
    name: "Stalwart Digital Necromancy Analysis"
    needs: [stalwart_preflight, adaptive_matrix_scan]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Download All Observatory Data
      uses: actions/download-artifact@v4
      with:
        pattern: stalwart-*
        path: ./stalwart-data/
        merge-multiple: true
    
    - name: Enhanced Failure Analysis
      run: |
        echo "🧬 Running Enhanced Stalwart Analysis..."
        
        # Ensure analysis script is executable
        chmod +x .github/scripts/failure-analysis.sh
        
        # Run analysis with comprehensive error handling
        if .github/scripts/failure-analysis.sh stalwart-mode stalwart-data stalwart-analysis; then
          echo "✅ Analysis completed successfully"
        else
          echo "⚠️ Analysis completed with warnings, continuing..."
        fi
        
        # Create additional stalwart-specific analysis
        mkdir -p stalwart-analysis/stalwart-reports
        
        {
          echo "# Stalwart Observatory Analysis Report"
          echo "Generated: $(date -u)"
          echo "Scan ID: ${{ needs.stalwart_preflight.outputs.scan_id }}"
          echo "System Fingerprint: ${{ needs.stalwart_preflight.outputs.system_fingerprint }}"
          echo "Risk Level: ${{ needs.stalwart_preflight.outputs.risk_level }}"
          echo "Matrix Scope: ${{ needs.stalwart_preflight.outputs.proceed_with_matrix }}"
          echo ""
          echo "## Data Collection Summary"
          echo "Preflight Data: $(find stalwart-data -name "*preflight*" | wc -l) files"
          echo "Runner Data: $(find stalwart-data -name "*runner*" | wc -l) files"
          echo "Outcome Files: $(find stalwart-data -name "outcome.json" | wc -l) files"
          echo ""
          echo "## Observatory Effectiveness"
          
          # Count outcomes
          TOTAL_OUTCOMES=$(find stalwart-data -name "outcome.json" | wc -l)
          if [ "$TOTAL_OUTCOMES" -gt 0 ]; then
            SUCCESS_COUNT=$(grep -l '"outcome": "SUCCESS"' stalwart-data/*/outcome.json 2>/dev/null | wc -l || echo "0")
            FAILURE_COUNT=$(grep -l '"outcome": "FAILURE"' stalwart-data/*/outcome.json 2>/dev/null | wc -l || echo "0")
            
            echo "Total Runners: $TOTAL_OUTCOMES"
            echo "Successful: $SUCCESS_COUNT"
            echo "Failed: $FAILURE_COUNT"
            
            if [ "$TOTAL_OUTCOMES" -gt 0 ]; then
              SUCCESS_RATE=$((SUCCESS_COUNT * 100 / TOTAL_OUTCOMES))
              echo "Success Rate: ${SUCCESS_RATE}%"
            fi
          else
            echo "No outcome data collected"
          fi
          
          echo ""
          echo "## Psycho-Noir Integration Status"
          echo "🦾 Stalwart Observatory: OPERATIONAL"
          echo "🧬 Digital Necromancy: ACTIVE"
          echo "🎭 Failure Classification: HIERARCHICAL"
          echo "📊 Data Extraction: CONTINUOUS"
        } > stalwart-analysis/stalwart-reports/analysis-summary.md
        
        # Display the summary
        cat stalwart-analysis/stalwart-reports/analysis-summary.md

    - name: Upload Stalwart Analysis
      uses: actions/upload-artifact@v4
      with:
        name: stalwart-analysis-${{ needs.stalwart_preflight.outputs.scan_id }}
        path: stalwart-analysis/
        retention-days: 90

    - name: Final Observatory Summary
      run: |
        echo ""
        echo "🦾 === STALWART OBSERVATORY MISSION COMPLETE ==="
        echo "Scan ID: ${{ needs.stalwart_preflight.outputs.scan_id }}"
        echo "Risk Level: ${{ needs.stalwart_preflight.outputs.risk_level }}"
        echo "Matrix Scope: ${{ needs.stalwart_preflight.outputs.proceed_with_matrix }}"
        echo "Analysis Complete: $(date -u)"
        echo ""
        echo "🎭 The Observatory has successfully captured and catalogued"
        echo "   digital essence from failed runners, transforming chaos"
        echo "   into structured knowledge within our taxonomic framework."
        echo ""
        echo "📊 All data artifacts available in workflow artifacts"
        echo "🧬 Digital Necromancy analysis available for download"
        echo "==============================================="