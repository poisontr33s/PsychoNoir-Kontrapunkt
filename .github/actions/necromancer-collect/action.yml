name: '🧙‍♂️ Necromancer Collect - Psycho-Noir Edition'
description: 'Wrap commands to capture failures, classify errors with Psycho-Noir thematic analysis, and emit structured archaeology data for the Digital Necromancy Observatory'
author: 'Psycho-Noir Kontrapunkt - Digital Necromancy Observatory System'

inputs:
  name:
    description: 'Human-readable name for this command execution'
    required: true
  run:
    description: 'Command to execute'
    required: true
  cwd:
    description: 'Working directory (optional)'
    required: false
    default: '.'
  category:
    description: 'Failure category classification'
    required: true
    type: choice
    options:
      - frontend
      - backend
      - security
      - integration
      - deployment
  variant:
    description: 'Variant identifier (e.g., browser type, python version, OS)'
    required: true
  shell:
    description: 'Shell to use for command execution'
    required: false
    default: 'bash'
  psycho-noir-mode:
    description: 'Psycho-Noir analysis perspective (skyskraper|rustbelt|invisible-hand|adaptive)'
    required: false
    default: 'adaptive'
  archaeological-depth:
    description: 'Analysis depth level (surface|standard|deep|archaeological)'
    required: false
    default: 'standard'

outputs:
  outcome:
    description: 'Command outcome (SUCCESS|FAILURE)'
    value: ${{ steps.execute-command.outputs.outcome }}
  error-type:
    description: 'Classified error type'
    value: ${{ steps.classify-errors.outputs.error-type }}
  duration:
    description: 'Command execution duration in seconds'
    value: ${{ steps.execute-command.outputs.duration }}
  psycho-noir-signature:
    description: 'Identified Psycho-Noir failure signature'
    value: ${{ steps.psycho-noir-analysis.outputs.signature }}

runs:
  using: composite
  steps:
    - name: Setup Necromancer Environment
      shell: bash
      run: |
        # Create logs directory structure
        mkdir -p logs/necromancer
        mkdir -p artifacts/necromancer
        
        # Setup problem matchers for common tools
        echo "::add-matcher::.github/scripts/necromancer/matchers/jest.json" || true
        echo "::add-matcher::.github/scripts/necromancer/matchers/pytest.json" || true
        echo "::add-matcher::.github/scripts/necromancer/matchers/eslint.json" || true
        echo "::add-matcher::.github/scripts/necromancer/matchers/tsc.json" || true
        echo "::add-matcher::.github/scripts/necromancer/matchers/generic.json" || true

    - name: Execute Command with Monitoring
      id: execute-command
      shell: ${{ inputs.shell }}
      working-directory: ${{ inputs.cwd }}
      run: |
        # Record start time
        START_TIME=$(date +%s)
        LOG_FILE="logs/necromancer/${{ inputs.name }}-command.log"
        
        echo "🧙‍♂️ NECROMANCER: Executing '${{ inputs.name }}' in category '${{ inputs.category }}'"
        echo "📁 Working directory: ${{ inputs.cwd }}"
        echo "⏰ Started at: $(date -Iseconds)"
        echo "🔧 Command: ${{ inputs.run }}"
        echo "---"
        
        # Execute command with tee to capture both stdout and stderr
        set +e
        ( ${{ inputs.run }} ) 2>&1 | tee "$LOG_FILE"
        EXIT_CODE=${PIPESTATUS[0]}
        set -e
        
        # Record end time and calculate duration
        END_TIME=$(date +%s)
        DURATION=$((END_TIME - START_TIME))
        
        echo "---"
        echo "⏱️  Duration: ${DURATION}s"
        echo "🚦 Exit code: $EXIT_CODE"
        
        # Set outputs
        echo "exit-code=$EXIT_CODE" >> $GITHUB_OUTPUT
        echo "duration=$DURATION" >> $GITHUB_OUTPUT
        
        if [ $EXIT_CODE -eq 0 ]; then
          echo "outcome=SUCCESS" >> $GITHUB_OUTPUT
          echo "✅ Command succeeded"
        else
          echo "outcome=FAILURE" >> $GITHUB_OUTPUT
          echo "❌ Command failed with exit code $EXIT_CODE"
        fi

    - name: Classify Errors and Generate Outcome
      id: classify-errors
      shell: bash
      run: |
        # Invoke error classification script
        python3 .github/scripts/necromancer/parse_errors.py \
          --log-file "logs/necromancer/${{ inputs.name }}-command.log" \
          --name "${{ inputs.name }}" \
          --category "${{ inputs.category }}" \
          --variant "${{ inputs.variant }}" \
          --exit-code "${{ steps.execute-command.outputs.exit-code }}" \
          --duration "${{ steps.execute-command.outputs.duration }}" \
          --outcome "${{ steps.execute-command.outputs.outcome }}" \
          --output-dir "artifacts/necromancer"
        
        # Read error type from classification output
        if [ -f "artifacts/necromancer/outcome.json" ]; then
          ERROR_TYPE=$(python3 -c "import json; print(json.load(open('artifacts/necromancer/outcome.json'))['error_type'])")
          echo "error-type=$ERROR_TYPE" >> $GITHUB_OUTPUT
          echo "🏷️ Classified as: $ERROR_TYPE"
        else
          echo "error-type=UNKNOWN" >> $GITHUB_OUTPUT
          echo "⚠️ Classification failed, defaulting to UNKNOWN"
        fi

    - name: 🎭 Psycho-Noir Thematic Analysis
      id: psycho-noir-analysis
      shell: bash
      run: |
        echo "🎭 Performing Psycho-Noir thematic analysis..."
        LOG_FILE="logs/necromancer/${{ inputs.name }}-command.log"
        
        # Initialize signature
        PSYCHO_NOIR_SIGNATURE="STANDARD_ENGINEERING_PATTERN"
        
        # Psycho-Noir pattern detection
        if [ -f "$LOG_FILE" ]; then
          if grep -qi "prediction\|forecast\|model\|systematic\|control" "$LOG_FILE"; then
            PSYCHO_NOIR_SIGNATURE="KAUSALITETS_ARKITEKTEN_INTERFERENCE"
          elif grep -qi "neural\|network\|ai\|synthetic\|synapse" "$LOG_FILE"; then
            PSYCHO_NOIR_SIGNATURE="SYNTETISKE_SYNAPSER_GLITCH"
          elif grep -qi "workaround\|hack\|manual\|improvise\|adapt" "$LOG_FILE"; then
            PSYCHO_NOIR_SIGNATURE="RUSTBELT_IMPROVISATION_CASCADE"
          elif grep -qi "anomal\|unexplain\|impossible\|paradox\|mystery" "$LOG_FILE"; then
            PSYCHO_NOIR_SIGNATURE="USYNLIG_HÅND_MANIFESTATION"
          fi
        fi
        
        case "${{ inputs.psycho-noir-mode }}" in
          "skyskraper")
            echo "🏙️ Skyskraperen Analysis: Systematic control perspective"
            echo "- Evaluating predictive modeling integrity"
            echo "- Assessing information system coherence"
            ;;
          "rustbelt")
            echo "🔧 Rustbeltet Analysis: Survival infrastructure perspective"
            echo "- Measuring adaptive resilience capabilities"
            echo "- Evaluating improvisation effectiveness"
            ;;
          "invisible-hand")
            echo "👁️ Den Usynlige Hånd Analysis: Emergent pattern perspective"
            echo "- Detecting hidden systemic influences"
            echo "- Identifying anomalous behavior patterns"
            ;;
          "adaptive")
            echo "🌀 Adaptive Analysis: Multi-perspective integration"
            echo "- Cross-domain pattern correlation"
            echo "- Holistic system behavior assessment"
            ;;
        esac
        
        echo "signature=$PSYCHO_NOIR_SIGNATURE" >> $GITHUB_OUTPUT
        echo "🧬 Psycho-Noir Signature: $PSYCHO_NOIR_SIGNATURE"
        
        # Create enhanced archaeological record
        cat > "artifacts/necromancer/psycho-noir-analysis.json" << EOF
        {
          "psycho_noir_signature": "$PSYCHO_NOIR_SIGNATURE",
          "analysis_mode": "${{ inputs.psycho-noir-mode }}",
          "archaeological_depth": "${{ inputs.archaeological-depth }}",
          "command_name": "${{ inputs.name }}",
          "category": "${{ inputs.category }}",
          "variant": "${{ inputs.variant }}",
          "analysis_timestamp": "$(date -Iseconds)"
        }
        EOF

    - name: Upload Necromancer Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: necromancer-${{ runner.os }}-${{ inputs.category }}-${{ inputs.variant }}
        path: |
          logs/necromancer/
          artifacts/necromancer/
        retention-days: 14